<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Secretaria" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Secretaria — Milgrup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1 class="brand">Secretaria</h1>
        <span class="date" id="today"></span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="pro" role="tab">Profesional <span class="count" id="count-pro">0</span></button>
        <button class="tab" data-tab="personal" role="tab">Personal <span class="count" id="count-personal">0</span></button>
      </nav>
    </header>

    <main class="main">
      <section class="list-section" id="list-pro">
        <ul class="task-list" id="tasks-pro"></ul>
        <p class="empty" id="empty-pro">Sin tareas profesionales pendientes.</p>
      </section>
      <section class="list-section hidden" id="list-personal">
        <ul class="task-list" id="tasks-personal"></ul>
        <p class="empty" id="empty-personal">Sin tareas personales pendientes.</p>
      </section>
    </main>

    <footer class="composer">
      <div class="composer-row">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="Anota una tarea..."
          autocomplete="off"
          enterkeyhint="done"
        />
        <button class="mic-btn" id="mic-btn" aria-label="Dictar tarea" title="Dictar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button class="add-btn" id="add-btn" aria-label="Añadir tarea">+</button>
      </div>
      <div class="composer-meta">
        <span class="hint" id="mic-status">Listening...</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
